name = "requeue"
main = "src/index.ts"
compatibility_date = "2026-09-04"

# Cloudflare D1 database.
[[d1_databases]]
binding = "DB"
database_name = "requeue"
database_id = "0b0d372c-cccb-4ea8-9d12-9a453419ac3a"
migrations_dir = "migrations"

# D1-backed outbox drain — not Cloudflare Queues (paid).
[triggers]
crons = ["* * * * *"]
