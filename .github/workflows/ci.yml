# Requeue Worker CI + deploy (GitHub Actions free tier).
#
# Required repository secrets for deploy (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token (Workers Scripts:Edit + D1:Edit). Never commit it.
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id (hosted: 550ca8e6b415f74ad69ef9a5714911bc).
#
# Deploy is skipped when either secret is unset. Do not reference `secrets` in
# job-level `if` (GitHub rejects that and fails the whole workflow). See CI.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Empty secrets are empty strings here — never print them.
  deploy-gate:
    name: Check deploy secrets
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            echo "in GitHub → Settings → Secrets and variables → Actions. See CI.md."
          fi

  deploy:
    name: Deploy Worker
    needs: deploy-gate
    if: needs.deploy-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Same as `npm run db:migrate:remote` (wrangler d1 migrations apply --remote).
      # Wrangler 4.x has no --yes; GitHub Actions is non-interactive so confirmation
      # is skipped automatically. Does not run scripts/seed-local.sql.
      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply requeue --remote

      - name: Deploy
        run: npx wrangler deploy
