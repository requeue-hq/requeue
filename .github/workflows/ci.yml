# Requeue Worker CI + deploy (GitHub Actions free tier).
#
# Required repository secrets for deploy (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token (Workers Scripts:Edit + D1:Edit). Never commit it.
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id (hosted: 550ca8e6b415f74ad69ef9a5714911bc).
#
# The deploy job is skipped when either secret is unset. See CI.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Deploy Worker
    needs: ci
    # Push to main only, and only when Maya has set both Cloudflare secrets.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.CLOUDFLARE_API_TOKEN != '' &&
      secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Same as `npm run db:migrate:remote` (wrangler d1 migrations apply --remote).
      # Wrangler records applied files in D1; --yes is non-interactive CI only.
      # Does not run scripts/seed-local.sql.
      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply requeue --remote --yes

      - name: Deploy
        run: npx wrangler deploy
